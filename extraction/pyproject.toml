[project]
name = "schooltrace-extraction"
version = "0.1.0"
description = "Local document-extraction model: training, benchmarking, evaluation (spec.md §5, §7.5)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    # NuExtract3's `qwen3_5` architecture needed a git install of transformers
    # until it landed in a stable release. It has: 5.17.0 carries `qwen3_5`, so
    # the git dependency is gone. Do not relax this floor — an older release
    # fails at load with `KeyError: 'qwen3_5'`.
    "transformers>=5.17",
    # Loading the processor pulls in Qwen3VLVideoProcessor, which requires
    # torchvision at import time even though nothing here processes video.
    # Omitting it fails only when the model is actually loaded, not at install.
    "torchvision>=0.19",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.11",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    # serve.py: the loopback inference service the API calls.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "huggingface-hub>=0.26",
]

# This directory is a flat layout with several top-level packages, so
# setuptools refuses to guess: `pip install -e .` fails outright with
# "Multiple top-level packages discovered in a flat-layout". Naming them is the
# documented fix, and it also keeps `data/` — which holds test PDFs, not
# importable code — out of any built distribution.
[tool.setuptools]
packages = ["schemas", "scripts"]
py-modules = []

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
