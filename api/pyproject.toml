[project]
name = "schooltrace-api"
version = "0.1.0"
description = "SchoolTrace API: accounting engine, agent orchestration, workflows"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
cfo = ["openai"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
