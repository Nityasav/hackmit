[project]
name = "schooltrace-api"
version = "0.1.0"
description = "SchoolTrace API: accounting engine and bundle endpoints"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest from scattering a .pytest_cache/ dir through the repo.
addopts = "-p no:cacheprovider"
