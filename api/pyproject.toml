[project]
name = "schooltrace-api"
version = "0.1.0"
description = "Sherlock API: accounting engine and bundle endpoints"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "openai>=2.0",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "pypdfium2>=5.13.0",
    "pillow>=12.3.0",
    "httpx>=0.28.1",
    # `rapidocr`, not `rapidocr-onnxruntime`. The latter's last release is
    # capped at Python <3.13, so on 3.14 it cannot be installed and every
    # scanned page fails to decode. onnxruntime is named explicitly because
    # the successor does not pull an inference engine of its own.
    "rapidocr>=3.9",
    "onnxruntime>=1.30",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.optional-dependencies]
cfo = ["openai"]
extractor = [
    "accelerate>=1.15.0",
    "peft>=0.21.0",
    "torch>=2.14.0",
    # Loading the processor imports Qwen3VLVideoProcessor, which requires
    # torchvision even though nothing here touches video. Leaving it out fails
    # only when the model actually loads, not at install.
    "torchvision>=0.19",
    "transformers>=5",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest from scattering a .pytest_cache/ dir through the repo.
addopts = "-p no:cacheprovider"
